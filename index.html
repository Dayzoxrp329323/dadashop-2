<script>

let token =
  localStorage.getItem(
    "dadashop_token"
  ) || "";

let user =
  JSON.parse(
    localStorage.getItem(
      "dadashop_user"
    ) || "null"
  );

let cart =
  JSON.parse(
    localStorage.getItem(
      "dadashop_cart"
    ) || "[]"
  );

let category = "all";

let languageIndex =
  Number(
    localStorage.getItem(
      "dadashop_language"
    ) || 0
  );

const languages = [

  {
    title:
      "Achète. Vends. Recommence.",

    text:
      "Découvre des articles que tu vas aimer et vends facilement ceux dont tu n'as plus besoin.",

    search:
      "Rechercher un article..."
  },

  {
    title:
      "Buy. Sell. Repeat.",

    text:
      "Discover items you love and easily sell the things you no longer need.",

    search:
      "Search for an item..."
  },

  {
    title:
      "Compra. Vende. Repite.",

    text:
      "Descubre artículos que te encantan y vende lo que ya no necesitas.",

    search:
      "Buscar un artículo..."
  },

  {
    title:
      "Покупай. Продавай. Повторяй.",

    text:
      "Находи любимые вещи и продавай то, что тебе больше не нужно.",

    search:
      "Поиск товара..."
  },

  {
    title:
      "Al. Sat. Yenidən.",

    text:
      "Sevdiyin məhsulları kəşf et və artıq ehtiyacın olmayan əşyaları asanlıqla sat.",

    search:
      "Məhsul axtar..."
  }

];


/* ==============================
   API
============================== */

async function api(
  url,
  options={}
){

  options.headers = {
    ...(options.headers || {})
  };

  if(token){

    options.headers.Authorization =
      "Bearer " + token;

  }

  const response =
    await fetch(
      url,
      options
    );

  const data =
    await response
      .json()
      .catch(() => ({}));

  if(!response.ok){

    throw new Error(
      data.error ||
      "Une erreur est survenue."
    );

  }

  return data;
}


/* ==============================
   PRODUITS
============================== */

async function loadProducts(){

  try{

    const search =
      document.getElementById(
        "search"
      ).value;

    const params =
      new URLSearchParams();

    if(search){
      params.set(
        "search",
        search
      );
    }

    if(category !== "all"){

      params.set(
        "category",
        category
      );

    }

    const data =
      await api(
        "/api/products?" +
        params.toString()
      );

    renderProducts(
      data.products
    );

  }catch(error){

    showToast(
      error.message
    );

  }

}


function renderProducts(
  products
){

  const container =
    document.getElementById(
      "products"
    );

  document.getElementById(
    "count"
  ).textContent =
    products.length +
    " article(s)";

  if(!products.length){

    container.innerHTML = `

      <div class="empty">

        <div
          style="
            font-size:45px;
            margin-bottom:10px;
          "
        >
          🔎
        </div>

        <h3>
          Aucun article trouvé
        </h3>

        <p>
          Essaie une autre recherche.
        </p>

      </div>

    `;

    return;
  }

  container.innerHTML =
    products
      .map(product => `

        <article class="card">

          <div class="cardImg">

            ${
              product.image

              ?

              `
                <img
                  src="${escapeHTML(
                    product.image
                  )}"
                  alt="${escapeHTML(
                    product.title
                  )}"
                >
              `

              :

              `
                <div class="noImage">
                  📦
                </div>
              `
            }

          </div>

          <div class="cardBody">

            <div class="cardTitle">

              ${escapeHTML(
                product.title
              )}

            </div>

            <div class="cardMeta">

              ${escapeHTML(
                product.category
              )}

              ·

              ${escapeHTML(
                product.seller
              )}

            </div>

            <div class="cardBottom">

              <strong class="price">

                ${Number(
                  product.price
                ).toFixed(2)} €

              </strong>

              <button
                class="btn light"
                onclick="addCart(
                  ${product.id}
                )"
              >
                🛒 Ajouter
              </button>

            </div>

          </div>

        </article>

      `)
      .join("");

}


/* ==============================
   CATÉGORIES
============================== */

function setCategory(
  value,
  button
){

  category = value;

  document
    .querySelectorAll(
      ".category"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  loadProducts();

}


/* ==============================
   PANIER
============================== */

function addCart(id){

  cart.push(id);

  localStorage.setItem(
    "dadashop_cart",
    JSON.stringify(cart)
  );

  updateCart();

  showToast(
    "Article ajouté au panier 🛒"
  );

}


function updateCart(){

  document.getElementById(
    "cartCount"
  ).textContent =
    cart.length;

}


async function openCart(){

  if(!cart.length){

    openModal(`

      <div class="modalHead">

        <h2>
          🛒 Panier
        </h2>

        <button
          class="close"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>

      <div class="empty">

        Ton panier est vide.

      </div>

    `);

    return;
  }

  try{

    const data =
      await api(
        "/api/products"
      );

    const items =
      cart
        .map(
          id =>
            data.products.find(
              product =>
                product.id === id
            )
        )
        .filter(Boolean);

    const total =
      items.reduce(
        (sum,item) =>
          sum +
          Number(item.price),
        0
      );

    openModal(`

      <div class="modalHead">

        <h2>
          🛒 Ton panier
        </h2>

        <button
          class="close"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>

      ${items.map(
        (item,index) => `

          <div class="cartItem">

            ${
              item.image

              ?

              `
                <img
                  class="cartImage"
                  src="${escapeHTML(
                    item.image
                  )}"
                >
              `

              :

              `
                <div
                  class="cartImage"
                  style="
                    display:grid;
                    place-items:center;
                    background:#eee;
                    font-size:30px;
                  "
                >
                  📦
                </div>
              `
            }

            <div class="cartInfo">

              <div class="cartTitle">

                ${escapeHTML(
                  item.title
                )}

              </div>

              <strong>

                ${Number(
                  item.price
                ).toFixed(2)} €

              </strong>

            </div>

            <button
              class="btn danger"
              onclick="removeCart(
                ${index}
              )"
            >
              ×
            </button>

          </div>

        `
      ).join("")}

      <div class="total">

        <span>
          Total
        </span>

        <span>
          ${total.toFixed(2)} €
        </span>

      </div>

      <button
        class="btn primary"
        style="width:100%"
        onclick="openPayment()"
      >
        💳 Continuer vers le paiement
      </button>

    `);

  }catch(error){

    showToast(
      error.message
    );

  }

}


function removeCart(index){

  cart.splice(
    index,
    1
  );

  localStorage.setItem(
    "dadashop_cart",
    JSON.stringify(cart)
  );

  updateCart();

  openCart();

}


/* ==============================
   PAIEMENT TEST
============================== */

function openPayment(){

  if(!user){

    openLogin();

    return;

  }

  openModal(`

function previewPhotos(
  event
){

  const preview =
    document.getElementById(
      "preview"
    );

  preview.innerHTML = "";

  const files =
    Array.from(
      event.target.files || []
    );

  files.forEach(file => {

    const reader =
      new FileReader();

    reader.onload =
      function(event){

        const image =
          document.createElement(
            "img"
          );

        image.src =
          event.target.result;

        preview.appendChild(
          image
        );

      };

    reader.readAsDataURL(
      file
    );

  });

}

/* ==============================
   MODALES
============================== */

function openModal(
  content
){

  document.getElementById(
    "modal"
  ).innerHTML =
    content;

  document.getElementById(
    "modalBg"
  ).classList.add(
    "open"
  );

}


function closeModal(){

  document.getElementById(
    "modalBg"
  ).classList.remove(
    "open"
  );

}


function closeOutside(
  event
){

  if(
    event.target.id ===
    "modalBg"
  ){

    closeModal();

  }

}


/* ==============================
   UTILITAIRES
============================== */

function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2800
    );

}


function scrollToProducts(){

  document
    .querySelector(".main")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
